[workspace]
members = ["crates/amp-core", "apps/amp-player", "apps/amp-cast"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
amp-core = { path = "crates/amp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
strip = true
