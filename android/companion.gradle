apply plugin: 'com.android.application'
android {
    namespace 'cloud.gitwide.ampverse'
    compileSdk 35
    defaultConfig {
        applicationId "cloud.gitwide.ampverse.${ampModule}"
        minSdk 28; targetSdk 35
        versionCode 35; versionName '0.3.1'
        buildConfigField 'String', 'MODULE', '"'+ampModule+'"'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging = true } }
    sourceSets.main {
        java.srcDirs += ['../../companion/java','../../app/src/main/java',"../../features/${ampModule}/java"]
        java.includes = ['**/CompanionActivity.java','**/ModuleRpc.java','**/FeatureScreen.java','**/Appearance.java','**/Chrome.java','**/UiSections.java']
        if(ampModule == 'lab') java.includes += ['**/lab/*.java']
        if(ampModule == 'remote') java.includes += ['**/RemotePanel.java','**/ControlDiscovery.java','**/CastDiscovery.java','**/CastClient.java','**/ProtectedCastSource.java']
        if(ampModule == 'cast') java.includes += ['**/CastClient.java','**/CastDiscovery.java','**/ProtectedCastSource.java','**/GoogleCastActivity.java','**/GoogleCastOptions.java']
        if(ampModule == 'podcasts') java.includes += ['**/PodcastsPanel.java']
        res.srcDirs += ['../../app/src/main/res']
        if(ampModule == 'lab') res.srcDirs += ['../../features/lab/res']
        assets.srcDirs += ['../../app/src/main/assets']
        if(ampModule == 'lab') assets.srcDirs += ['../../features/lab/assets']
    }
    signingConfigs { published {
        if(System.getenv('AMP_ANDROID_KEYSTORE')) {
            storeFile file(System.getenv('AMP_ANDROID_KEYSTORE'))
            storePassword System.getenv('AMP_ANDROID_STORE_PASSWORD');keyAlias System.getenv('AMP_ANDROID_KEY_ALIAS');keyPassword System.getenv('AMP_ANDROID_KEY_PASSWORD')
        }
    }}
    buildTypes { release { signingConfig signingConfigs.published } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.media3:media3-session:1.8.1'
    implementation 'androidx.media3:media3-datasource:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    if(ampModule == 'lab') {
        implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
        implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    }
    if(ampModule == 'cast') implementation 'com.google.android.gms:play-services-cast-framework:22.3.0'
}
