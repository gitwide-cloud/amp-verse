plugins { id 'com.android.application' }
android {
    namespace 'cloud.gitwide.ampverse'
    compileSdk 35
    defaultConfig {
        applicationId 'cloud.gitwide.ampverse'
        minSdk 28
        targetSdk 35
        versionCode 20
        versionName '0.2.0-dev'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-session:1.8.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
