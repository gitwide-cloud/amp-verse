name: Build and verify AMP Verse
on:
  push:
    branches: [main, codex/sag75-server-manager]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      android_preview:
        description: Build unsigned Android beta artifacts for local signing (no release publication)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: amp-verse-windows
            suffix: .exe
          - os: ubuntu-24.04
            artifact: amp-verse-linux
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine download version
        id: package_version
        shell: bash
        run: echo "version=$(python tools/package_downloads.py desktop-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          cat > "$RUNNER_TEMP/amp-ubuntu.list" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          SOURCES
          sources=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/amp-ubuntu.list" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0)
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 "${sources[@]}" update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 "${sources[@]}" install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libasound2-dev libasound2-plugins pulseaudio pulseaudio-utils ffmpeg xvfb
      - name: Windows audio test dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
      - name: Prepare verified official Lab URL-import dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/test_setup_lab_youtube.py
          python tools/setup_lab_youtube.py --dest test-output/lab-tools
      - run: python tools/test_engine_release_metadata.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Studio browser session flow
        run: node --test apps/amp-cast/web/studio-session.test.cjs
      - run: cargo fmt --all --check
      - name: Verify canonical desktop update and rollback
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -File tools/test_install-tested-desktop.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File tools/test_install-tested-desktop-transaction.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows raw and canonical metadata paths
        if: runner.os == 'Windows'
        run: cargo test -p amp-core raw_and_canonical_paths_share_preparation_and_catalog_keys --locked -- --nocapture
      - run: cargo test --workspace --locked
      - name: Prepare exact shipped pipe-only receiver codec fixture
        run: python tools/setup_receiver_ffplay.py
      - name: Verify HTTP receiver with pipe-only FFplay and silent audio
        run: cargo test -p amp-player --bin amp-player station_receiver::tests::network_disabled_ffplay_decodes_http_via_pipe --locked -- --ignored --exact --test-threads=1 --nocapture
      - name: Verify regular playlist AutoMix on a clocked silent output
        if: runner.os == 'Linux'
        shell: bash
        env:
          ALSA_CONFIG_PATH: ${{ runner.temp }}/amp-automix-asound.conf
          PULSE_SERVER: unix:${{ runner.temp }}/amp-automix-pulse/native
        run: |
          python - <<'PYCONFIG'
          import os
          from pathlib import Path
          runtime = Path(os.environ["RUNNER_TEMP"]) / "amp-automix-pulse"
          runtime.mkdir(mode=0o700, exist_ok=True)
          (runtime / "startup.pa").write_text(
              "load-module module-native-protocol-unix socket=" + str(runtime / "native") + " auth-anonymous=1\n"
              "load-module module-null-sink sink_name=amp_automix rate=48000 channels=2\n"
              "set-default-sink amp_automix\n"
          )
          Path(os.environ["ALSA_CONFIG_PATH"]).write_text(
              'pcm.!default { type pulse hint { show on description "AMP Verse CI silent output" } }\n'
              'ctl.!default { type pulse }\n'
          )
          PYCONFIG
          pulseaudio --daemonize=no --use-pid-file=no --exit-idle-time=-1 -n --file="$RUNNER_TEMP/amp-automix-pulse/startup.pa" --log-target="file:$RUNNER_TEMP/amp-automix-pulse/server.log" &
          pulse_pid=$!
          trap 'kill "$pulse_pid" 2>/dev/null || true; wait "$pulse_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if pactl info >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          pactl info
          cargo test -p amp-player --bin amp-player dj_logic::tests::regular_playlist_automatic_preload_shuffle_cancel_and_handoff --locked -- --ignored --exact --test-threads=1 --nocapture
      - name: Verify supervised live sender recovers after a five-second outage
        run: cargo test -p amp-player --bin amp-player live_mix::tests::supervised_sender_recovers_current_pcm_after_five_second_transport_outage --locked -- --ignored --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify integrated transition fixtures and actual mixer/Cast true peaks
        run: |
          python tests/sag65/generate_sag65_fixtures.py --out-dir target/sag65-fixtures
          cargo test -p amp-core -p amp-player -p amp-cast f10 --locked -- --ignored --nocapture --test-threads=1
          cargo test -p amp-core --test sag65_vectors --locked -- --nocapture --test-threads=1
      - name: Verify finite server Player queues with generated real audio
        run: cargo test -p amp-cast --lib player_control::tests::generated --locked -- --ignored --test-threads=1
      - name: Verify adaptive LAN audio with real codecs and lifecycle recovery
        run: cargo test -p amp-cast --lib hls::tests --locked -- --include-ignored --test-threads=1
      - name: Test actual deck playback with silent audio device
        if: runner.os == 'Linux'
        env:
          SDL_AUDIODRIVER: dummy
        run: cargo test -p amp-core --features analysis --locked -- --ignored --test-threads=1
      - name: Verify MP3 Lab editor foundation with real codecs
        if: runner.os == 'Linux'
        run: cargo test -p amp-player --bin amp-player lab_editor::tests::ffmpeg_export_smoke -- --ignored
      - name: Verify sampler clip export with real codecs
        if: runner.os == 'Linux'
        run: cargo test -p amp-player --bin amp-player sample_editor::tests::clip_export_preserves_source_and_respects_selection -- --ignored
      - name: Verify Lab URL import with local downloader and real codecs
        if: runner.os == 'Linux'
        run: |
          mkdir -p test-output/lab-import
          rustc tools/lab_youtube_fixture.rs -o test-output/lab-import/yt-dlp-fixture
          ffmpeg -n -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=2 test-output/lab-import/fixture.wav
          ffmpeg -n -hide_banner -loglevel error -i test-output/lab-import/fixture.wav -c:a libmp3lame -b:a 256k test-output/lab-import/loaded.mp3
          AMP_LAB_TOOLS="$PWD/test-output/lab-tools" AMP_LAB_YOUTUBE_FIXTURE="$PWD/test-output/lab-import/yt-dlp-fixture" cargo test -p amp-player --bin amp-player lab_youtube::tests::local_pipeline -- --ignored --test-threads=1
          AMP_LAB_LOADED_MP3="$PWD/test-output/lab-import/loaded.mp3" cargo test -p amp-player --bin amp-player lab_editor::tests::downloaded_mp3 -- --ignored
      - run: cargo build --workspace --release --locked
      - name: Build base player without analysis implementation
        run: cargo build -p amp-player --release --locked
      - name: Verify optional analysis process
        if: runner.os == 'Linux'
        run: |
          python3 tools/smoke_engine_addon.py target/release/amp-engine
          AMP_ENGINE_TEST_EXE="$PWD/target/release/amp-engine" cargo test -p amp-player real_installed_engine_round_trip -- --ignored
      - name: Test live radio with generated audio
        if: runner.os == 'Linux'
        run: python3 tools/smoke_cast.py target/release/amp-cast
      - name: Test portable preparation with generated audio
        if: runner.os == 'Linux'
        run: python3 tools/smoke_preparation.py target/release/amp-prepare
      - name: Test desktop HTTP and WebSocket show control
        if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python3 tools/smoke_show_control.py target/release/amp-player
      - name: Capture actual desktop UI
        if: runner.os == 'Linux'
        run: |
          fixture_music="$(mktemp -d)"
          ffmpeg -y -f lavfi -i sine=frequency=440:duration=3 "$fixture_music/Tone.wav"
          target/release/amp-prepare "$fixture_music"
          python3 -c "import sys; sys.path.insert(0,'tools'); from fixture_catalog import read,write; d=read(sys.argv[1],'tracks/Tone.wav.json'); d['cue_in']=0.2; d['manual_override']=True; write(sys.argv[1],'tracks/Tone.wav.json',d)" "$fixture_music"
          target/release/amp-prepare "$fixture_music" --force
          for theme in classic modern-light modern-dark; do
            for view in player compact mini combined library playlists analysis devices preparation rules dj dj-window dj-library sampler lab addons cast; do
              timeout 35s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 AMP_THEME="$theme" AMP_VERSE_CONFIG_DIR=test-output/theme-config AMP_SCREENSHOT_VIEW="$view" AMP_SCREENSHOT="test-output/$theme-$view.png" target/release/amp-player "$fixture_music"
              test -s "test-output/$theme-$view.png"
            done
          done
      - name: Verify magnetic native windows on X11
        if: runner.os == 'Linux'
        run: |
          timeout 35s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 AMP_DOCK_SMOKE=test-output/native-docking.json target/release/amp-player
          python3 -c "import json; r=json.load(open('test-output/native-docking.json')); assert all(r.values()), r"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: amp-player-ui
          path: test-output/*.png
      - name: Package binaries and documentation
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/amp-player${{ matrix.suffix }} target/release/amp-cast${{ matrix.suffix }} target/release/amp-prepare${{ matrix.suffix }} target/release/amp-update${{ matrix.suffix }} dist/
          if [ "${{ runner.os }}" = "Windows" ]; then cp target/release/amp-keylock.dll dist/; fi
          mkdir -p dist/licenses/signalsmith
          cp -r apps/amp-player/vendor/signalsmith/* dist/licenses/signalsmith/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md assets/amp-verse.ico dist/
          python -c 'import json,os,pathlib,tomllib; version=tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]; pathlib.Path("dist/build.json").write_text(json.dumps({"source_sha":os.environ["GITHUB_SHA"],"version":version,"release_channel":"beta","beta":1},indent=2)+"\n")'
          python -c 'import shutil; shutil.copytree("docs", "dist/docs", ignore=shutil.ignore_patterns("tested-preview-install.md"))'
          cp -r licenses dist/
          mkdir -p dist/licenses/mp3-lab
          cp third-party/mp3-lab/LICENSE third-party/mp3-lab/PROVENANCE.md dist/licenses/mp3-lab/
      - name: Package official AMP Lab YouTube tools
        shell: bash
        run: |
          mkdir -p dist/tools
          cp -r test-output/lab-tools dist/tools/lab-youtube
      - name: Include Lab tool recovery setup
        shell: bash
        run: |
          mkdir -p dist/setup
          cp tools/setup_lab_youtube.py dist/setup/
      - name: Include canonical updater and legacy installer compatibility
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp tools/install-tested-desktop.ps1 tools/restore-tested-desktop.ps1 dist/
          cp docs/tested-desktop-install.md dist/
          cp tools/launch-desktop.vbs dist/
          cp docs/beta-install.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v${{ steps.package_version.outputs.version }}
          path: dist/
      - name: Package optional analysis add-on
        shell: bash
        run: |
          mkdir -p engine-dist
          cp target/release/amp-engine${{ matrix.suffix }} LICENSE THIRD_PARTY_NOTICES.md engine-dist/
          cp -r licenses engine-dist/
          if [ "${{ runner.os }}" = "Windows" ]; then asset=amp-engine-windows-x86_64.exe; else asset=amp-engine-linux-x86_64; fi
          cp target/release/amp-engine${{ matrix.suffix }} "engine-dist/$asset"
          (cd engine-dist && sha256sum "$asset" > "$asset.sha256")
          # Only stable release tags are auto-installable. Beta artifacts remain manual.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${{ runner.os }}" = "Windows" ]; then platform=windows-x86_64; else platform=linux-x86_64; fi
            python tools/engine_release_metadata.py --directory engine-dist --platform "$platform" --release "$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: amp-analysis-engine-${{ runner.os }}
          path: engine-dist/

  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: integrations/companion/package-lock.json
      - run: npm ci
        working-directory: integrations/companion
      - run: npm test
        working-directory: integrations/companion
      - run: npm run package
        working-directory: integrations/companion
      - uses: actions/upload-artifact@v4
        with:
          name: ampverse-companion
          path: integrations/companion/*.tgz

  android-preview:
    name: Android unsigned beta
    if: github.event_name == 'workflow_dispatch' && inputs.android_preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and assemble unsigned release betas
        run: |
          test -z "$AMP_ANDROID_KEYSTORE" || { echo 'Beta job must not receive a private signing key.'; exit 1; }
          gradle -p android :app:assembleLiteRelease :app:assembleFullRelease :app:testFullReleaseUnitTest :app:lintFullRelease :app:lintLiteRelease :app:assembleFullDebugAndroidTest :amp-dj:assembleRelease :amp-dj:lintRelease :amp-lab:assembleRelease :amp-lab:lintRelease :amp-cast:assembleRelease :amp-cast:lintRelease :amp-podcasts:assembleRelease :amp-podcasts:lintRelease :amp-remote:assembleRelease :amp-remote:lintRelease
      - name: Package unsigned APKs and official local-signing tool
        run: python android/tools/package_unsigned.py --destination android-beta-dist
      - uses: actions/upload-artifact@v4
        with:
          name: amp-verse-android-unsigned-${{ github.sha }}
          path: android-beta-dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-beta-test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/androidTest/
            android/modules/*/build/reports/

  android-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build with the persistent Android signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.AMP_ANDROID_KEYSTORE_BASE64 }}
          AMP_ANDROID_KEYSTORE: ${{ runner.temp }}/amp-release.keystore
          AMP_ANDROID_STORE_PASSWORD: ${{ secrets.AMP_ANDROID_STORE_PASSWORD }}
          AMP_ANDROID_KEY_ALIAS: ${{ secrets.AMP_ANDROID_KEY_ALIAS }}
          AMP_ANDROID_KEY_PASSWORD: ${{ secrets.AMP_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the persistent AMP Android signing secrets before publishing an update.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$AMP_ANDROID_KEYSTORE"
          trap 'rm -f "$AMP_ANDROID_KEYSTORE"' EXIT
          gradle -p android :app:assembleLiteRelease :app:assembleFullRelease :app:testFullReleaseUnitTest :app:lintFullRelease :app:lintLiteRelease :amp-dj:assembleRelease :amp-dj:lintRelease :amp-lab:assembleRelease :amp-lab:lintRelease :amp-cast:assembleRelease :amp-cast:lintRelease :amp-podcasts:assembleRelease :amp-podcasts:lintRelease :amp-remote:assembleRelease :amp-remote:lintRelease
          python tools/package_android_modules.py --variant release --release-tag "$GITHUB_REF_NAME" --destination android-dist
          python -c 'import json,pathlib; m=json.loads(pathlib.Path("android/app/build/outputs/apk/full/release/output-metadata.json").read_text()); pathlib.Path("android-dist/version-code.txt").write_text(str(m["elements"][0]["versionCode"]))'
      - uses: actions/upload-artifact@v4
        with:
          name: android-published
          path: android-dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amp-verse-*
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: amp-analysis-engine-*
          path: packages
      - run: |
          cd packages
          # Artifact storage strips executable bits. Restore them before making
          # Linux ZIPs so the updater can restart the newly installed binaries.
          find . -type f \( -name amp-player -o -name amp-update -o -name amp-cast -o -name amp-prepare -o -name amp-engine -o -name amp-engine-linux-x86_64 -o -name deno -o -name yt-dlp \) -exec chmod +x {} +
          for dir in amp-verse-*; do (cd "$dir" && zip -r "../$dir.zip" .); done
          for dir in amp-analysis-engine-*; do (cd "$dir" && zip -r "../$dir-${GITHUB_REF_NAME}.zip" .); done
          cp amp-analysis-engine-Windows/amp-engine-windows-x86_64.exe* .
          cp amp-analysis-engine-Linux/amp-engine-linux-x86_64* .
          sha256sum *.zip > SHA256SUMS.txt
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-published
          path: packages
      - name: Generate verified cross-platform update manifest
        run: python tools/update_manifest.py --version "${GITHUB_REF_NAME#v}" --directory packages --apk "$(find packages -maxdepth 1 -name 'amp-verse-full-*.apk' -print -quit)" --version-code "$(cat packages/version-code.txt)"
      - name: Package optional AMP Podcasts
        run: python tools/package_podcasts.py --version "${GITHUB_REF_NAME#v}" --destination packages
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            packages/*.zip
            packages/*.apk
            packages/SHA256SUMS.txt
            packages/amp-update.json
            packages/amp-engine-*
            packages/*.ampplugin*
