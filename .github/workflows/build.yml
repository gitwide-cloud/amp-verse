name: Build and verify AMP Verse
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: amp-verse-windows
            suffix: .exe
          - os: ubuntu-24.04
            artifact: amp-verse-linux
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libasound2-dev ffmpeg xvfb
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test actual deck playback with silent audio device
        if: runner.os == 'Linux'
        env:
          SDL_AUDIODRIVER: dummy
        run: cargo test -p amp-core --locked -- --include-ignored
      - run: cargo build --workspace --release --locked
      - name: Test live radio with generated audio
        if: runner.os == 'Linux'
        run: python3 tools/smoke_cast.py target/release/amp-cast
      - name: Test portable preparation with generated audio
        if: runner.os == 'Linux'
        run: python3 tools/smoke_preparation.py target/release/amp-prepare
      - name: Capture actual desktop UI
        if: runner.os == 'Linux'
        run: |
          mkdir -p test-output/music
          ffmpeg -y -f lavfi -i sine=frequency=440:duration=3 test-output/music/Tone.wav
          for theme in classic modern-light modern-dark; do
            for view in player combined library preparation dj lab addons cast; do
              timeout 35s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 AMP_THEME="$theme" AMP_VERSE_CONFIG_DIR=test-output/theme-config AMP_SCREENSHOT_VIEW="$view" AMP_SCREENSHOT="test-output/$theme-$view.png" target/release/amp-player test-output/music
              test -s "test-output/$theme-$view.png"
            done
          done
      - name: Verify magnetic native windows on X11
        if: runner.os == 'Linux'
        run: |
          timeout 35s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 AMP_DOCK_SMOKE=test-output/native-docking.json target/release/amp-player
          python3 -c "import json; r=json.load(open('test-output/native-docking.json')); assert all(r.values()), r"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: amp-player-ui
          path: test-output/*.png
      - name: Package binaries and documentation
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/amp-player${{ matrix.suffix }} target/release/amp-cast${{ matrix.suffix }} target/release/amp-prepare${{ matrix.suffix }} dist/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/
          cp -r docs dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amp-verse-*
          path: packages
      - run: |
          cd packages
          for dir in amp-verse-*; do (cd "$dir" && zip -r "../$dir.zip" .); done
          sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            packages/*.zip
            packages/SHA256SUMS.txt
