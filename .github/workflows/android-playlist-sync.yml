name: Android playlist synchronization
on:
  push:
    branches: ['feature/android-server-owner-flow']
    paths: ['android/**', 'crates/amp-dj-policy/**', 'tools/build_android_dj.py', 'Cargo.*', '.github/workflows/android-playlist-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-playlist-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Shared model and Full edition unit tests
        run: gradle -p android :app:testFullDebugUnitTest
      - name: Build both editions, device tests, and Cast client consumers
        run: gradle -p android :app:assembleFullDebug :app:assembleFullDebugAndroidTest :app:assembleLiteDebug :amp-cast:assembleDebug :amp-remote:assembleDebug
      - name: Lint both app editions
        run: gradle -p android :app:lintFullDebug :app:lintLiteDebug
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-playlist-sync-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
            android/app/build/outputs/apk/*/debug/*.apk
