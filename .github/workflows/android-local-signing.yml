name: Exact Android release for local signing
on:
  pull_request:
    paths:
      - '.github/workflows/android-local-signing.yml'
      - 'tools/package_android_local_signing.py'
      - 'tools/test_package_android_local_signing.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: android-local-signing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: '695ef0b6fc05a82dad5e9c5b0fd729dc93dc5f6c'
          fetch-depth: 0
          path: product-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check delivery validation and approved source/native proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/test_package_android_local_signing.py
          cd product-source
          test "$(git rev-parse HEAD)" = 695ef0b6fc05a82dad5e9c5b0fd729dc93dc5f6c
          python3 tools/android_rc.py gate --ref refs/heads/release/thanksgiving-20261126 --tag v1.1.0-rc.1 --native-run 45343446267 --output "$RUNNER_TEMP/android-local-source-gate.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product-source -> target
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release outputs without any private key
        run: |
          test -z "$AMP_ANDROID_KEYSTORE"
          gradle -p product-source/android :app:assembleLiteRelease :app:assembleFullRelease :app:testFullReleaseUnitTest :app:lintFullRelease :app:lintLiteRelease :amp-dj:assembleRelease :amp-lab:assembleRelease :amp-cast:assembleRelease :amp-podcasts:assembleRelease :amp-remote:assembleRelease
          mkdir -p android-local-unsigned
          cp "$RUNNER_TEMP/android-local-source-gate.json" android-local-unsigned/
          python3 tools/package_android_local_signing.py --source product-source --destination android-local-unsigned --expected-source 695ef0b6fc05a82dad5e9c5b0fd729dc93dc5f6c
      - uses: actions/upload-artifact@v4
        with:
          name: android-local-unsigned-695ef0b6
          path: android-local-unsigned/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-local-release-reports-${{ github.sha }}
          path: product-source/android/app/build/reports/
