name: Exact Android release for local signing
on:
  pull_request:
    paths:
      - '.github/workflows/android-local-signing.yml'
      - 'tools/package_android_local_signing.py'
      - 'tools/test_package_android_local_signing.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: android-local-signing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: '7023834bae4a25e1c68617c24ba0593841e7d336'
          fetch-depth: 0
          path: product-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check delivery validation and approved source/native proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/test_package_android_local_signing.py
          cd product-source
          test "$(git rev-parse HEAD)" = 7023834bae4a25e1c68617c24ba0593841e7d336
          python3 - <<'PY'
          import time
          from tools.android_rc import github
          for attempt in range(90):
              run = github("actions/runs/45466782614")
              if run["status"] == "completed":
                  if run["conclusion"] != "success":
                      raise SystemExit("Frozen source native qualification failed")
                  break
              time.sleep(20)
          else:
              raise SystemExit("Timed out waiting for frozen source native qualification")
          PY
          python3 tools/android_rc.py gate --ref refs/heads/release/thanksgiving-20261126 --tag v1.1.0-rc.1 --native-run 45466782614 --output "$RUNNER_TEMP/android-local-source-gate.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product-source -> target
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release outputs without any private key
        run: |
          test -z "$AMP_ANDROID_KEYSTORE"
          gradle -p product-source/android :app:assembleLiteRelease :app:assembleFullRelease :app:assembleFullDebugAndroidTest :app:testFullReleaseUnitTest :app:lintFullRelease :app:lintLiteRelease :amp-dj:assembleRelease :amp-lab:assembleRelease :amp-cast:assembleRelease :amp-podcasts:assembleRelease :amp-remote:assembleRelease
          mkdir -p android-local-unsigned
          cp "$RUNNER_TEMP/android-local-source-gate.json" android-local-unsigned/
          python3 tools/package_android_local_signing.py --source product-source --destination android-local-unsigned --expected-source 7023834bae4a25e1c68617c24ba0593841e7d336
          mkdir -p android-local-unsigned/test-instrumentation
          test_apk=product-source/android/app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk
          test -f "$test_apk"
          cp "$test_apk" android-local-unsigned/test-instrumentation/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$test_apk" > android-local-unsigned/test-instrumentation/badging.txt
          sha256sum "$test_apk" > android-local-unsigned/test-instrumentation/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-local-unsigned-7023834b
          path: android-local-unsigned/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-local-release-reports-${{ github.sha }}
          path: product-source/android/app/build/reports/
