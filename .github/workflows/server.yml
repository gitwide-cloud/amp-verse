name: Headless Cast candidates
on:
  push:
    branches: [main]
    paths: ['crates/**', 'apps/amp-cast/**', 'deploy/**', 'Cargo.*', 'tools/smoke_coordination.py', 'tools/smoke_discovery.py', 'tools/smoke_energy_cues.py', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  linux-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --locked -p amp-core -p amp-cast
      - run: cargo build --locked --release -p amp-cast
      - run: python3 tools/smoke_preparation.py target/release/amp-prepare
      - run: python3 tools/smoke_energy_cues.py target/release/amp-prepare
      - run: python3 tools/smoke_coordination.py target/release/amp-prepare target/release/amp-cast
      - run: python3 tools/smoke_cast.py target/release/amp-cast
      - run: python3 tools/smoke_discovery.py target/release/amp-cast
  images:
    needs: linux-foundation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: |
            ghcr.io/gitwide-cloud/amp-verse-cast:edge-${{ matrix.suffix }}
            ghcr.io/gitwide-cloud/amp-verse-cast:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=cast-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=cast-${{ matrix.suffix }}
      - name: Test candidate container before publication
        run: |
          image=ghcr.io/gitwide-cloud/amp-verse-cast:${{ github.sha }}-${{ matrix.suffix }}
          mkdir -p test-output/image-music
          chmod 777 test-output/image-music
          python3 - <<'PY'
          import math,struct,wave
          with wave.open('test-output/image-music/Tone.wav','wb') as w:
              w.setparams((1,2,11025,0,'NONE','not compressed'))
              w.writeframes(b''.join(struct.pack('<h',int(6000*math.sin(2*math.pi*440*i/11025))) for i in range(11025*4)))
          PY
          docker run -d --platform '${{ matrix.platform }}' --name amp-cast-check --mount "type=bind,source=$PWD/test-output/image-music,target=/music" -e AMP_ANALYSIS_ENABLED=true -e AMP_ANALYSIS_WORKERS=1 "$image"
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec amp-cast-check curl --fail --silent http://127.0.0.1:8787/health; then ready=true; break; fi
            sleep 1
          done
          docker logs amp-cast-check
          if [ "$ready" != true ]; then exit 1; fi
          prepared=false
          for attempt in $(seq 1 60); do
            if docker exec amp-cast-check curl --fail --silent http://127.0.0.1:8787/api/status | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["analysis"]["completed"] == 1 else 1)'; then prepared=true; break; fi
            sleep 1
          done
          test "$prepared" = true
          docker exec amp-cast-check curl --fail --silent -X POST http://127.0.0.1:8787/api/start
          docker exec amp-cast-check sh -c 'curl --silent --max-time 5 http://127.0.0.1:8787/listen.mp3 -o /tmp/cast-check.mp3 || test "$?" = 28'
          docker exec amp-cast-check ffmpeg -v error -i /tmp/cast-check.mp3 -t 0.2 -f null -
          docker exec amp-cast-check curl --fail --silent -X POST http://127.0.0.1:8787/api/stop
          docker exec amp-cast-check uname -m
          docker stats --no-stream amp-cast-check
          docker stop --time 30 amp-cast-check
      - name: Publish tested candidate images
        run: |
          docker push ghcr.io/gitwide-cloud/amp-verse-cast:${{ github.sha }}-${{ matrix.suffix }}
          docker push ghcr.io/gitwide-cloud/amp-verse-cast:edge-${{ matrix.suffix }}
