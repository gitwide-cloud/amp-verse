name: Android preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Name APK downloads with embedded version
        id: package
        run: python tools/package_downloads.py android --source android/app/build/outputs/apk/debug --destination android-dist >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: amp-verse-android-v${{ steps.package.outputs.version }}-${{ github.run_number }}
          path: |
            android-dist/*.apk
            third-party/mp3-lab/android-third-party-sources.zip
            third-party/mp3-lab/LICENSE
            third-party/mp3-lab/THIRD_PARTY_NOTICES.md
            third-party/mp3-lab/PROVENANCE.md
