name: Server-owned Google Cast candidates
on:
  push:
    branches: ['feature/server-google-cast-20261120']
    paths: ['apps/amp-cast/**', 'Cargo.*', 'docs/SERVER_GOOGLE_CAST.md', '.github/workflows/server-google-cast.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-google-cast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-cast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formatting and whitespace
        run: |
          cargo fmt --all -- --check
          git diff --check
      - name: Linux codec fixtures
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # CI only: bypass a slow regional HTTP mirror, retaining Ubuntu archive signatures.
            cat > "$RUNNER_TEMP/amp-ubuntu.list" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          SOURCES
            sources=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/amp-ubuntu.list" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0)
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 "${sources[@]}" update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 "${sources[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Windows codec fixtures
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Complete server library regressions including real TLS Cast fixtures
        run: cargo test --locked -p amp-cast --lib
      - name: Web server-owned control flow and source noninterference
        run: node --test apps/amp-cast/web/studio-session.test.cjs
      - name: Strict server lint
        run: cargo clippy --locked -p amp-cast --all-targets -- -D warnings
      - name: Build the existing standalone server
        run: cargo build --locked --release -p amp-cast
      - name: Package versioned candidate without configuration or credentials
        shell: python
        run: |
          import datetime, hashlib, os, pathlib, platform, tarfile, tomllib, zipfile, json
          root=pathlib.Path('.')
          version=tomllib.loads((root/'Cargo.toml').read_text())['workspace']['package']['version']
          windows=platform.system()=='Windows'
          target=root/'target/release'/('amp-cast.exe' if windows else 'amp-cast')
          stem=f"AMP-Verse-Server-{version}-{'Windows' if windows else 'Linux'}-x86_64-Google-Cast-{os.environ['GITHUB_SHA'][:12]}"
          out=root/'dist';out.mkdir()
          archive=out/(stem+('.zip' if windows else '.tar.gz'))
          manifest=out/'build.json'
          manifest.write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'version':version,'platform':platform.system(),'architecture':'x86_64','binary_name':target.name,'binary_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'built_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'feature':'server_owned_google_cast','candidate':True},indent=2)+'\n')
          files=[(target,target.name),(manifest,'build.json'),(root/'docs/SERVER_GOOGLE_CAST.md','SERVER_GOOGLE_CAST.md')]
          if windows:
              with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as package:
                  for source,name in files: package.write(source,name)
          else:
              with tarfile.open(archive,'w:gz') as package:
                  for source,name in files: package.add(source,arcname=name)
          (out/(archive.name+'.sha256')).write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: AMP-Verse-Server-${{ matrix.os }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
