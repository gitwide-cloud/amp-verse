name: Server-owned Google Cast candidates
on:
  push:
    branches: ['feature/server-google-cast-20261120']
    paths: ['apps/amp-cast/**', 'Cargo.*', 'docs/SERVER_GOOGLE_CAST.md', '.github/workflows/server-google-cast.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-google-cast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-cast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formatting and whitespace
        run: |
          cargo fmt --all -- --check
          git diff --check
      - name: Real TLS Cast receiver, capability, authorization and lifetime fixtures
        run: cargo test --locked -p amp-cast --lib google_cast
      - name: Existing speaker consumer and probe failure lifecycle
        run: |
          cargo test --locked -p amp-cast --lib server_output
          cargo test --locked -p amp-cast --lib station_control::output_device_tests
      - name: Web server-owned control flow and source noninterference
        run: node --test apps/amp-cast/web/studio-session.test.cjs
      - name: Strict server lint
        run: cargo clippy --locked -p amp-cast --all-targets -- -D warnings
      - name: Build the existing standalone server
        run: cargo build --locked --release -p amp-cast
      - name: Package versioned candidate without configuration or credentials
        shell: python
        run: |
          import hashlib, os, pathlib, platform, tarfile, tomllib, zipfile
          root=pathlib.Path('.')
          version=tomllib.loads((root/'Cargo.toml').read_text())['workspace']['package']['version']
          windows=platform.system()=='Windows'
          target=root/'target/release'/('amp-cast.exe' if windows else 'amp-cast')
          stem=f"AMP-Verse-Server-{version}-{'Windows' if windows else 'Linux'}-x86_64-Google-Cast-{os.environ['GITHUB_SHA'][:12]}"
          out=root/'dist';out.mkdir()
          archive=out/(stem+('.zip' if windows else '.tar.gz'))
          files=[(target,target.name),(root/'docs/SERVER_GOOGLE_CAST.md','SERVER_GOOGLE_CAST.md')]
          if windows:
              with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as package:
                  for source,name in files: package.write(source,name)
          else:
              with tarfile.open(archive,'w:gz') as package:
                  for source,name in files: package.add(source,arcname=name)
          (out/(archive.name+'.sha256')).write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: AMP-Verse-Server-${{ matrix.os }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
