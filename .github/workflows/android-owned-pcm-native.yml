name: Verify Android owned master native broadcast
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/test_android_owned_pcm.py'
      - 'tools/verify_android_owned_native.py'
      - '.github/workflows/android-owned-pcm-native.yml'
permissions:
  contents: read
concurrency:
  group: android-owned-pcm-native-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AMP_UI_TEST_X86: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile all editions, modules and native fixture
        run: |
          test -z "$AMP_ANDROID_KEYSTORE"
          gradle -p android :app:assembleLiteDebug :app:assembleFullDebug :app:assembleFullDebugAndroidTest :app:testFullDebugUnitTest :app:lintFullDebug :app:lintLiteDebug :amp-dj:assembleDebug :amp-lab:assembleDebug :amp-cast:assembleDebug :amp-podcasts:assembleDebug :amp-remote:assembleDebug
          cargo build --locked -p amp-cast --bin amp-cast
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 - <<'PYTHON'
          import pathlib,zipfile
          apk=next(pathlib.Path('android/app/build/outputs/apk/full/debug').glob('*.apk'))
          with zipfile.ZipFile(apk) as z:
              assert 'lib/x86_64/libamp_dj_policy.so' in z.namelist()
              assert 'lib/x86_64/libffmpegkit.so' in z.namelist()
          PYTHON
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android native MP3 pipes and isolated server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/verify_android_owned_native.py --server-binary target/debug/amp-cast --output test-output/android-owned-native -- gradle -p android :app:connectedFullDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cloud.gitwide.ampverse.OwnedMasterNativeDeviceTest -Pandroid.testInstrumentationRunnerArguments.amp_server=http://10.0.2.2:28987
      - name: Collect emulator logs
        if: always()
        run: |
          mkdir -p test-output/android-owned-native
          timeout 10s adb logcat -d > test-output/android-owned-native/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-owned-native-${{ github.sha }}
          path: |
            test-output/android-owned-native/
            android/app/build/reports/androidTests/
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
