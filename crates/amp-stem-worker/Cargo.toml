[package]
name = "amp-stem-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
realfft = "=3.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = "=0.8.9"
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_Security"] }
