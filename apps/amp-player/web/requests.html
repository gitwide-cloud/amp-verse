<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMP Verse · Request a song</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#1b1e23;color:#eee}*{box-sizing:border-box}body{max-width:780px;margin:auto;padding:20px}h1{font-size:24px;color:#ffc328}p{color:#bfc5ce}button,input{font:inherit;color:inherit;background:#30353d;border:1px solid #68717f;border-radius:6px;padding:12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #ffc328}section{background:#242932;border:1px solid #505a69;border-radius:8px;padding:16px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#search{width:100%;margin:12px 0}#password{max-width:100%;flex:1;min-width:140px}#songs{list-style:none;padding:0;margin:0;max-height:48vh;overflow:auto}#songs button{width:100%;text-align:left;margin:3px 0;overflow-wrap:anywhere}#songs button[aria-pressed=true]{border-color:#ffc328;background:#594414}#send{background:#ffc328;color:#171a1f;font-weight:700}#within{width:80px}#status{min-height:2.8em;overflow-wrap:anywhere}small{color:#bfc5ce}label{display:block}#selected{overflow-wrap:anywhere}</style>
<script src="/requests.js" defer></script></head><body>
<h1>AMP⚡VERSE · Request a song</h1><p>Search this DJ’s library, select a song, then send your request.</p>
<section><div class="row"><label for="password">DJ password</label><input id="password" type="password" placeholder="If required" autocomplete="off"><button id="connect">Connect / Refresh</button></div><p id="dj">Not connected</p></section>
<section><label for="search">Song title</label><input id="search" type="search" placeholder="Type any part of the song name…" autocomplete="off" disabled><small id="count"></small><ul id="songs" aria-label="Matching songs"></ul></section>
<section><p id="selected">Select a song above.</p><div class="row"><label for="within">Within the next</label><input id="within" type="number" min="1" max="5" value="3"><span>songs</span><button id="send" disabled>Send request</button></div><p id="status" role="status" aria-live="polite"></p></section>
</body></html>
