<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMP Verse · Remote</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#1b1e23;color:#eee}*{box-sizing:border-box}body{max-width:760px;margin:auto;padding:18px}h1{color:#ffc328;font-size:24px}section{background:#242932;border:1px solid #505a69;border-radius:8px;padding:16px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input{font:inherit;background:#30353d;color:inherit;border:1px solid #68717f;border-radius:6px;padding:12px}button{cursor:pointer;min-height:46px}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #ffc328}#auto[aria-pressed=true]{background:#ffc328;color:#171a1f}#password{flex:1;min-width:120px;width:100%}a{color:#ffc328}#song,#status{overflow-wrap:anywhere}#status{min-height:2.5em}small{color:#bfc5ce}input[type=range]{width:100%;padding:8px}label{display:block;margin:10px 0}
</style><script src="/remote.js" defer></script></head><body>
<h1>AMP⚡VERSE · Remote</h1><p>Control the Player / DJ on this PC.</p>
<section><div class="row"><input id="password" aria-label="Remote password" type="password" placeholder="Password, if required" autocomplete="off"><button id="connect">Connect / Refresh</button></div><p id="connection">Not connected</p></section>
<section><h2 id="song">No track loaded</h2><p id="playing">—</p><div class="row"><button id="play" disabled>Play</button><button id="pause" disabled>Pause</button><button id="next" disabled>Next / Mix next</button><button id="auto" aria-pressed="false" disabled>Auto DJ: OFF</button></div>
<label for="crossfader">Crossfader · A ↔ B</label><input id="crossfader" type="range" min="0" max="1" step="0.01" value="0.5" disabled>
<div class="row"><button id="quieter" disabled>Volume −</button><button id="louder" disabled>Volume +</button></div><p id="status" role="status" aria-live="polite"></p></section>
<section><a href="/requests">Search library / Request a song</a><p><small>Audio keeps playing on the PC. For phone playback or speaker casting, use AMP Cast. Losing this connection does not stop the music.</small></p></section>
</body></html>
