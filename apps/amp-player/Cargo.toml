[package]
name = "amp-player"
default-run = "amp-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
amp-core.workspace = true
cpal = "=0.18.2"
rtrb = "0.3"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "links", "default_fonts", "x11", "wayland"] }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = {version="0.8",features=["ws"]}
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

sha2 = "0.10"
libloading = "0.8"
tempfile = "3"
midir = "=0.11.1"
roxmltree = "=0.21.2"

rust_cast = "=0.21.0"
rustls = {version="0.23",default-features=false,features=["ring","std","tls12"]}
mdns-sd = "=0.21.7"

[dev-dependencies]
amp-cast = { path = "../amp-cast" }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
