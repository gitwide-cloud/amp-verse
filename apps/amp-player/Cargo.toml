[package]
name = "amp-player"
default-run = "amp-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
amp-core.workspace = true
cpal = "=0.18.2"
rtrb = "0.3"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "links", "default_fonts", "x11", "wayland"] }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = {version="0.8",features=["ws"]}
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
amp-cast = { path = "../amp-cast" }
