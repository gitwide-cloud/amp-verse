[package]
name = "amp-player"
default-run = "amp-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
amp-core.workspace = true
cpal = "=0.18.2"
rtrb = "0.3"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
amp-cast = { path = "../amp-cast" }
tokio.workspace = true
axum = "0.8"
