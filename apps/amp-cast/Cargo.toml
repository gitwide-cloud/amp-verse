[package]
name = "amp-cast"
default-run = "amp-cast"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "amp-server-update"
path = "src/update_helper.rs"

[dependencies]
amp-updater = { path = "../../crates/amp-updater" }
if-addrs = "0.15"
mdns-sd = "=0.21.7"
rust_cast = { version = "=0.21.0", features = ["cast"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
protobuf = "=3.7.2"
amp-core = { workspace = true, features = ["analysis"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
async-stream = "0.3"
bytes = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["json"] }
tempfile = "3"

[dev-dependencies]
rcgen = "0.13"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
